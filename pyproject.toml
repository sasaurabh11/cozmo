[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo"
version = "0.1.0"
description = "Floor-plan reconstruction and damage-scope pipeline (skeleton)"
readme = "README.md"
requires-python = ">=3.9,<3.13"   # open3d publishes no wheel for 3.13+
license = { text = "Proprietary" }
authors = [{ name = "Saurabh", email = "saurabh@zuvees.ae" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "numpy>=1.24",
    # Reconstruction. open3d supplies RANSAC plane fitting, normal estimation and
    # voxel downsampling; opencv and pandas are what the Stray Scanner loader
    # itself imports.
    "open3d>=0.18",
    "opencv-python-headless>=4.9",
    "pandas>=2.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0"]
semantics = ["torch>=2.2", "transformers>=4.56", "accelerate>=0.30"]

[project.scripts]
cozmo = "cozmo.cli:app"

[tool.setuptools.packages.find]
include = ["cozmo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
