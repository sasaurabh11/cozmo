[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo"
version = "0.1.0"
description = "Floor-plan reconstruction and damage-scope pipeline (skeleton)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Saurabh", email = "saurabh@zuvees.ae" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cozmo = "cozmo.cli:app"

[tool.setuptools.packages.find]
include = ["cozmo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
